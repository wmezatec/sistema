<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#232323">
<meta name="robots" content="noindex">
<title>WM TEC · Encuesta</title>
<link rel="icon" type="image/svg+xml" href="logo/wmtec-isotipo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{--carbon:#232323;--chapa:#e3e4df;--papel:#f7f7f3;--tinta:#1f201d;--tinta-suave:#55574f;--naranja:#f9a01b;--degradado:linear-gradient(90deg,#ffc107,#f9a01b 55%,#e07b00)}
*{box-sizing:border-box}
body{margin:0;background:var(--chapa);color:var(--tinta);font-family:"Archivo",system-ui,sans-serif;line-height:1.45}
header{background:var(--carbon);padding:22px 16px;display:flex;justify-content:center}
header img{height:44px}
main{max-width:560px;margin:0 auto;padding:22px 16px 48px}
h1{font-size:1.5rem;margin:0 0 6px;line-height:1.2}
.sub{margin:0 0 22px;color:var(--tinta-suave)}
fieldset{border:0;margin:0 0 14px;padding:16px;background:#fff;border-radius:20px;box-shadow:0 1px 0 #d3d5ce}
legend{float:left;width:100%;padding:0;margin-bottom:12px;font-weight:700;font-size:1.05rem}
.ops{display:grid;gap:6px;clear:both}
.ops label{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;background:#efefea;cursor:pointer;min-height:46px}
.ops input{position:absolute;opacity:0;pointer-events:none}
.ops label:has(input:checked){background:var(--carbon);color:#fff}
.ops label:has(input:focus-visible){outline:3px solid var(--naranja);outline-offset:2px}
.ops i{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid currentColor;opacity:.6}
.ops label:has(input:checked) i{background:var(--naranja);border-color:var(--naranja);opacity:1}
textarea{width:100%;min-height:96px;font:inherit;padding:12px 14px;border:0;border-radius:14px;background:#efefea;box-shadow:inset 2px 2px 4px rgba(0,0,0,.18);resize:vertical}
button{width:100%;border:0;border-radius:999px;padding:15px;font:inherit;font-weight:800;font-size:1.05rem;background:var(--degradado);color:var(--tinta);cursor:pointer;margin-top:6px}
button:disabled{opacity:.6}
.msg{background:#fff;border-radius:20px;padding:26px 20px;text-align:center}
.msg h1{margin-bottom:8px}
.err{color:#c23b2c;margin:10px 0 0;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><img src="logo/wmtec-logo-oscuro.svg" alt="WM TEC"></header>
<main>
  <div id="cargando" class="msg"><p>Cargando…</p></div>
  <div id="fin" class="msg" hidden><h1 id="fin-t">¡Gracias!</h1><p id="fin-p">Tu respuesta nos ayuda a trabajar mejor.</p></div>
  <form id="f" hidden>
    <h1 id="hola">¿Cómo te fue con nuestro trabajo?</h1>
    <p class="sub" id="sub">Son 5 preguntas, te lleva un minuto.</p>
    <div id="preg"></div>
    <fieldset><legend><label for="com">¿Algo que quieras contarnos? (opcional)</label></legend><textarea id="com" maxlength="2000"></textarea></fieldset>
    <button type="submit" id="enviar">Enviar respuestas</button>
    <p class="err" id="err" hidden></p>
  </form>
</main>
<script>
(function(){
  var SAT=["Muy satisfecho","Satisfecho","Neutral","Poco satisfecho","Nada satisfecho"],REC=["Seguro que sí","Probablemente sí","No sé","Probablemente no","Seguro que no"];
  var PREG=[["trabajo","¿Qué tan conforme quedaste con el trabajo realizado?",SAT],["tiempos","¿Cumplimos con los tiempos que acordamos?",SAT],["atencion","¿Cómo fue la atención y la comunicación?",SAT],["orden","¿Cómo quedó el lugar donde trabajamos (orden y limpieza)?",SAT],["recomienda","¿Nos recomendarías a otras personas?",REC]];
  var CF=window.WM_SUPA||{},tok=new URLSearchParams(location.search).get("t")||"",$=function(id){return document.getElementById(id)};
  function rpc(fn,body){return fetch(CF.url+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:CF.key,"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){if(!r.ok)throw 0;return r.json()})}
  function fin(t,p){$("cargando").hidden=true;$("f").hidden=true;$("fin").hidden=false;$("fin-t").textContent=t;$("fin-p").textContent=p}
  if(!/^[0-9a-f-]{36}$/i.test(tok)){fin("Enlace no válido","Pedile a WM TEC que te lo vuelva a mandar.");return}
  $("preg").innerHTML=PREG.map(function(q,n){return '<fieldset><legend>'+(n+1)+'. '+q[1]+'</legend><div class="ops">'+q[2].map(function(o,i){return '<label><input type="radio" name="'+q[0]+'" value="'+(5-i)+'" required><i></i>'+o+'</label>'}).join("")+'</div></fieldset>'}).join("");
  rpc("encuesta_ver",{t:tok}).then(function(r){var x=r&&r[0];
    if(!x){fin("Enlace no válido","Pedile a WM TEC que te lo vuelva a mandar.");return}
    if(x.respondida){fin("¡Gracias!","Esta encuesta ya fue respondida.");return}
    if(x.cliente)$("hola").textContent="Hola "+x.cliente+", ¿cómo te fue con nuestro trabajo?";
    if(x.ot)$("sub").textContent=x.ot+". Son 5 preguntas, te lleva un minuto.";
    $("cargando").hidden=true;$("f").hidden=false;
  }).catch(function(){fin("No se pudo abrir la encuesta","Probá de nuevo en un rato.")});
  $("f").onsubmit=function(e){e.preventDefault();var r={},b=$("enviar");
    PREG.forEach(function(q){var s=document.querySelector('input[name="'+q[0]+'"]:checked');if(s)r[q[0]]=+s.value});
    b.disabled=true;$("err").hidden=true;
    rpc("encuesta_responder",{t:tok,r:r,c:$("com").value.trim()}).then(function(ok){if(ok)fin("¡Gracias!","Tu respuesta nos ayuda a trabajar mejor.");else fin("¡Gracias!","Esta encuesta ya fue respondida.")})
      .catch(function(){b.disabled=false;$("err").textContent="No se pudo enviar. Probá de nuevo.";$("err").hidden=false})};
})();
</script>
</body>
</html>
